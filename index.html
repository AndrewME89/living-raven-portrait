<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d0d">
  <title>Haunted Raven Portrait</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="portrait" class="portrait" data-state="ACTIVE" aria-label="A living portrait of a raven in a cemetery">
    <div class="scene" id="scene">
      <div class="backdrop fallback-art" id="backdrop"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="mist mist--far" aria-hidden="true"></div>
      <div class="mist mist--near" aria-hidden="true"></div>
      <img class="raven-still" id="ravenStill" alt="A black raven perched in a Victorian cemetery">
      <video class="raven-video" id="ravenVideo" preload="metadata" playsinline></video>
      <canvas class="raven-video-canvas" id="ravenVideoCanvas" aria-hidden="true"></canvas>
      <div class="mausoleum-light" aria-hidden="true"></div>
      <div class="lightning-flash" aria-hidden="true"></div>
      <div class="watermark-mask" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>
    </div>
    <button class="sound-gate" id="soundGate" type="button">Awaken portrait</button>
    <aside class="debug-panel" id="debugPanel" hidden aria-label="Portrait debug controls">
      <div class="debug-heading"><span>Portrait controls</span><button type="button" data-action="fullscreen">Full screen</button></div>
      <div id="debugButtons" class="debug-buttons"></div>
      <p id="debugStatus" aria-live="polite">Resting</p>
    </aside>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
