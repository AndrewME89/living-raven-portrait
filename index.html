<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d0d">
  <title>Haunted Raven Portrait</title>
  <link rel="stylesheet" href="styles.css?v=2026-09-03-2">
</head>
<body>
  <main id="portrait" class="portrait" data-state="ACTIVE" aria-label="A living portrait of a raven in a cemetery">
    <div class="scene" id="scene">
      <div class="video-slot" id="videoSlotA" aria-hidden="true"><video class="raven-video" preload="auto" playsinline></video></div>
      <div class="video-slot" id="videoSlotB" aria-hidden="true"><video class="raven-video" preload="auto" playsinline></video></div>
    </div>
    <button class="sound-gate" id="soundGate" type="button">Awaken portrait</button>
    <aside class="debug-panel" id="debugPanel" hidden aria-label="Portrait debug controls">
      <div class="debug-heading"><span>Portrait controls</span><button type="button" data-action="fullscreen">Full screen</button></div>
      <div id="debugButtons" class="debug-buttons"></div>
      <p id="debugStatus" aria-live="polite">Resting</p>
    </aside>
  </main>
  <script src="config.js?v=2026-09-03-2"></script>
  <script src="app.js?v=2026-09-03-2"></script>
</body>
</html>
